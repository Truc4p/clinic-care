name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Start backend
        working-directory: backend
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          # wait for health
          for i in {1..20}; do
            if curl -sS http://127.0.0.1:8000/health >/dev/null; then
              echo ok && break
            fi
            sleep 1
          done

      - name: Run smoke test
        run: python3 tests/smoke_test.py

      - name: Lint Python
        working-directory: backend
        run: |
          pip install flake8 || true
          flake8 || true

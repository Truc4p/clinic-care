version: '3.8'
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    volumes:
      - ./backend:/app
      - db_data:/app/cliniccare.db
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=replace-me
      - DATABASE_URL=sqlite:///./cliniccare.db

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NUXT_PUBLIC_API_BASE=http://backend:8000
    depends_on:
      - backend

volumes:
  db_data:
